# Decap CMS 설정.
# 로그인 중계 서버는 infra/cms-auth-worker (Cloudflare Worker) — GitHub OAuth 앱
# "연세요양원 관리자 로그인"과 연결돼 있다. 2차 전환(도메인) 때 site_url 과
# Worker 의 ALLOWED_ORIGIN, OAuth 앱의 callback URL 을 함께 바꿔야 한다.
backend:
  name: github
  repo: prontfor85/yonsei-care-home
  branch: main
  base_url: https://ysc-cms-auth.cms-auth-worker.workers.dev

locale: ko
site_url: https://prontfor85.github.io/yonsei-care-home/
# 로그인 화면에 표시할 로고. 상대 경로라 도메인이 바뀌어도 그대로 동작한다.
logo_url: ../assets/logo.svg

media_folder: src/uploads
public_folder: /uploads

collections:
  - name: settings
    label: 사이트 설정
    files:
      - name: home
        label: 메인 화면
        file: src/_data/home.json
        fields:
          - name: heroImage
            label: 메인 대표 사진 (컴퓨터 화면용)
            widget: image
            required: false
            hint: "홈 첫 화면 전체에 배경으로 깔리는 가로로 긴 사진입니다. 왼쪽에 글자가 덮이므로 주요 피사체(인물·건물)는 오른쪽에 있어야 합니다. 어르신 얼굴이 나오면 본인 또는 보호자의 서면 동의가 필요합니다."
          - name: heroImageMobile
            label: 메인 대표 사진 (휴대폰 화면용)
            widget: image
            required: false
            hint: "휴대폰에서 보이는 세로형 사진입니다. 위쪽에 글자가 덮이므로 주요 피사체는 아래쪽 절반에 있어야 합니다. 비워두면 컴퓨터용 사진을 함께 씁니다."
          - name: heroImageAlt
            label: 사진 설명 (화면낭독기용)
            widget: string
            required: false
            hint: "눈이 불편한 방문자에게 읽어주는 한 줄 설명입니다. 예: 프로그램실에서 미술 활동 중인 모습"
          - name: heroTag
            label: 머리글 (제목 위 작은 글씨)
            widget: string
            hint: "예: 전북 김제 · 노인요양시설"
          - name: heroTitle
            label: 대표 문구 (큰 제목)
            widget: text
            hint: "줄을 바꾸면 화면에서도 그 자리에서 줄이 바뀝니다. 휴대폰 화면을 생각해 두 줄 안팎을 권합니다."
          - name: heroLead
            label: 소개 문장 (제목 아래 설명)
            widget: text
            hint: "두세 문장 이내를 권합니다."

  - name: notice
    label: 공지사항
    folder: src/notices
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { name: title, label: 제목, widget: string }
      - { name: date, label: 등록일, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: pinned, label: "상단 고정(필독)", widget: boolean, default: false, required: false }
      - { name: body, label: 내용, widget: markdown }

  - name: event
    label: 행사소식
    folder: src/events
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { name: title, label: 행사명, widget: string }
      - { name: date, label: 행사일, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: image, label: 대표 사진, widget: image, required: false, hint: "어르신 얼굴이 나오는 사진은 본인 또는 보호자의 서면 동의가 필요합니다." }
      - { name: summary, label: 한 줄 소개, widget: text }

  - name: photo
    label: 포토갤러리
    folder: src/photos
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    fields:
      - { name: title, label: 사진 설명, widget: string }
      - { name: date, label: 촬영 시기, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: image, label: 사진, widget: image, required: false, hint: "어르신 얼굴이 나오는 사진은 본인 또는 보호자의 서면 동의가 필요합니다." }
